# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
    "./crates/bevy_puppet",
    "./crates/bevy_puppet_macros",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

authors = ["Oleh Martsokha <o.martsokha@gmail.com>"]
repository = "https://github.com/declaredlost/bevy_puppet"

# Shared lints for every crate (opt in with `[lints] workspace = true`).
# The whole of `clippy::pedantic` is denied.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Lint exceptions are `#[expect]`s with a reason, so stale ones are reported.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Bevy systems take `Res`, `Query` and `Commands` by value by design.
needless_pass_by_value = "allow"
# Bevy systems naturally have many resource params and complex `Query`
# types: these lints fire on idiomatic Bevy code, so they're allowed
# workspace-wide rather than per system.
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# Default features are disabled for certain dependencies to allow
# downstream workspaces/crates to selectively enable them as needed.
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329

# Internal crates
bevy_puppet_macros = { path = "./crates/bevy_puppet_macros", version = "0.1.0" }

# Game engine (headless by default)
bevy = { version = "0.20", default-features = false, features = ["std"] }
bevy_curve = { version = "0.20", default-features = false, features = ["std"] }
# What Bevy's `Image` is built from, without its renderer
wgpu-types = { version = "30", default-features = false, features = [] }

# (De)serialization
serde = { version = "1.0", features = [] }
ron = { version = "0.12", features = [] }

# Derive macros & utilities
thiserror = { version = "2.0", features = [] }

# Proc macros
quote = { version = "1.0", features = [] }
syn = { version = "3.0", features = [] }

# Development: compile our code with light optimizations for fast iteration,
# and dependencies (Bevy) fully optimized so tests run quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
